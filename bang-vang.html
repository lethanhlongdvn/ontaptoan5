    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #2196F3;
            --bg: #f4f7f6;
            --dark: #2c3e50;
            --gold: #FFD700;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 0.8rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            white-space: nowrap;
        }

        .hero {
            text-align: center;
            padding: 18px 10px;
            background: linear-gradient(135deg, #1e3a8a, #0284c7);
            color: white;
        }

        .hero h1 {
            font-size: 1.5rem;
            margin: 0 0 4px;
            font-family: 'Bungee', cursive;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .hero p {
            font-size: 0.85rem;
            margin: 0;
            opacity: 0.9;
        }

        /* FILTER BAR */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px auto;
            max-width: 900px;
            padding: 0 10px;
            flex-wrap: wrap;
        }

        .btn-filter-bv {
            background: white;
            border: 1.5px solid #cbd5e1;
            color: #475569;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-filter-bv:hover, .btn-filter-bv.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
        }

        .admin-container {
            max-width: 1100px;
            margin: 5px auto 50px;
            padding: 0 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .week-accordion {
            background: white;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: 0.2s;
        }

        .week-header {
            padding: 12px 15px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            user-select: none;
        }

        .week-header.active {
            background: #e0f2fe;
            border-bottom: 2px solid #0284c7;
        }

        .week-title {
            font-weight: bold;
            font-size: 0.92rem;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .week-badge {
            background: #0284c7;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.72rem;
            white-space: nowrap;
        }

        .week-content {
            display: none;
            padding: 0;
            background: white;
        }

        .week-content.show {
            display: block;
        }

        .chart-section {
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .chart-title {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }

        .action-bar {
            padding: 8px 15px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
        }

        .btn-excel {
            background: #27ae60;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        th {
            background: #f1f2f6;
            color: #555;
            text-align: left;
            padding: 8px 10px;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            color: #333;
            white-space: nowrap;
        }

        .rank {
            font-weight: bold;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #eee;
            font-size: 0.75rem;
        }

        tr:nth-child(1) .rank { background: #ffd700; color: #000; }
        tr:nth-child(2) .rank { background: #cbd5e1; color: #000; }
        tr:nth-child(3) .rank { background: #cd7f32; color: #fff; }

        .score-badge {
            color: #d35400;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .time-badge {
            color: #27ae60;
            font-family: monospace;
            font-size: 0.8rem;
        }

        .class-badge {
            background: #eef2f7;
            color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            border: 1px solid #ddd;
            white-space: nowrap;
        }

        .attempt-badge {
            background: #fff3e0;
            color: #ef6c00;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            border: 1px solid #ffe0b2;
            white-space: nowrap;
        }

        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.75rem;
            margin-top: auto;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 3D PODIUM TOP 3 TRÊN BẢNG VÀNG */
        .lb-podium-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 12px;
            margin: 12px 15px;
            padding: 16px 12px 0;
            background: linear-gradient(180deg, #f8fafc, #edf2f7);
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
        }

        .podium-step {
            flex: 1;
            max-width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .podium-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }

        .podium-rank-1 .podium-avatar {
            width: 52px;
            height: 52px;
            border: 2.5px solid #eab308;
            background: linear-gradient(135deg, #fde047, #ca8a04);
            box-shadow: 0 0 16px rgba(234, 179, 8, 0.45);
        }

        .podium-crown {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.3rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            animation: bounceCrown 2s infinite ease-in-out;
        }

        @keyframes bounceCrown {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        .podium-rank-2 .podium-avatar {
            border: 2px solid #94a3b8;
            background: linear-gradient(135deg, #f1f5f9, #94a3b8);
        }

        .podium-rank-3 .podium-avatar {
            border: 2px solid #d97706;
            background: linear-gradient(135deg, #ffedd5, #c2410c);
        }

        .podium-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: #1e293b;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 2px;
        }

        .podium-class {
            font-size: 0.72rem;
            color: #64748b;
            margin-bottom: 2px;
        }

        .podium-score {
            font-size: 0.78rem;
            font-weight: 800;
            color: #d97706;
            margin-bottom: 4px;
        }

        .podium-pillar {
            width: 100%;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bungee', cursive;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.95);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 4px 10px rgba(0,0,0,0.1);
        }

        .podium-rank-1 .podium-pillar {
            height: 60px;
            background: linear-gradient(180deg, #eab308 0%, #a16207 100%);
            border: 1.5px solid #fde047;
            border-bottom: none;
        }

        .podium-rank-2 .podium-pillar {
            height: 45px;
            background: linear-gradient(180deg, #94a3b8 0%, #475569 100%);
            border: 1.5px solid #cbd5e1;
            border-bottom: none;
        }

        .podium-rank-3 .podium-pillar {
            height: 32px;
            background: linear-gradient(180deg, #c2410c 0%, #7c2d12 100%);
            border: 1.5px solid #fb923c;
            border-bottom: none;
        }

        .medal-summary-ribbon {
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            background: #fff;
            padding: 10px 15px;
            margin: 10px 15px 4px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 0.8rem;
        }

        .medal-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #334155;
        }

        .medal-badge-count {
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.78rem;
            color: #0f172a;
        }

        /* TOAST NOTIFICATION */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            min-width: 260px;
            max-width: 360px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.84rem;
            font-family: 'Lexend', sans-serif;
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s;
        }

        .toast.toast-success { border-left: 4px solid #10b981; }
        .toast.toast-error { border-left: 4px solid #ef4444; }
        .toast.toast-info { border-left: 4px solid #38bdf8; }
        .toast.toast-warning { border-left: 4px solid #f59e0b; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        function showToast(msg, type = 'info', title = '') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? '✅' : (type === 'error' ? '❌' : (type === 'warning' ? '⚠️' : 'ℹ️'));
            toast.innerHTML = `
                <span style="font-size:1.1rem;">${icon}</span>
                <div style="flex:1;">
                    ${title ? `<div style="font-weight:700; margin-bottom:2px; font-size:0.86rem;">${title}</div>` : ''}
                    <div>${msg}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px) scale(0.95)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

            id: 'topLabels',

                const { ctx } = chart;
                ctx.save();
                chart.data.datasets.forEach((dataset, i) => {
                    chart.getDatasetMeta(i).data.forEach((bar, index) => {
                        const value = dataset.data[index];
                        if (value > 0) {
                            ctx.fillStyle = '#444';

                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.fillText(value, bar.x, bar.y - 5);

                    });
                });
                ctx.restore();

        function exportExcel(week) {
            const table = document.querySelector(`#tbody-${week}`).parentElement;
            const rows = table.querySelectorAll('tr');
            const data = [];

            rows.forEach((row, rowIndex) => {
                const cols = row.querySelectorAll('th, td');
                const rowData = [];
                cols.forEach((col, colIndex) => {
                    let value = col.innerText.replace('⏱ ', '').replace('/100', '');
                    if (colIndex === 2 && rowIndex > 0) {
                        rowData.push({ v: value, t: 's' });
                    } else {
                        rowData.push(value);
                    }
                });
                data.push(rowData);
            });

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Tuần " + week);

        function parseDateToMs(str) {
            if (!str) return 0;
            try {
                const parts = str.split(' ');
                const timeParts = parts[0].split(':');
                const dateParts = parts[1].split('/');
                const d = new Date(dateParts[2], dateParts[1] - 1, dateParts[0], timeParts[0], timeParts[1], timeParts[2] || 0);
                return d.getTime();
            } catch(e) {
                return 0;
            }
        }

        db.ref('scores').on('value', (snap) => {

            renderAllWeeks();
        });

        function renderAllWeeks() {
            const allData = cachedAllScores;
            for (let i = 1; i <= 35; i++) {
                const weekData = allData[`Tuan_${i}`] || allData[`tuan${i}`];
                const tbody = document.getElementById(`tbody-${i}`);
                const countBadge = document.getElementById(`count-${i}`);
                const chartSection = document.getElementById(`chart-section-${i}`);

                if (!tbody) continue;

                if (!weekData) {
                    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:15px; color:#999; font-size:0.8rem;">Chưa có dữ liệu lượt thi nào.</td></tr>`;
                    countBadge.innerText = `0 bạn`;
                    chartSection.style.display = 'none';
                    const mEl = document.getElementById(`medals-${i}`);
                    if (mEl) mEl.style.display = 'none';
                    const pEl = document.getElementById(`podium-${i}`);
                    if (pEl) pEl.style.display = 'none';
                    continue;
                }

                let filteredMap = new Map();
                for (let pushId in weekData) {
                    let entry = weekData[pushId];
                    entry._pushId = pushId;
                    let key = ((entry.fullName || entry.name || entry.username || "") + "|" + (entry.className || entry.class || "")).toLowerCase().trim();
                    if (!filteredMap.has(key)) {
                        filteredMap.set(key, entry);
                    } else {
                        let old = filteredMap.get(key);
                        if (entry.score > old.score || (entry.score === old.score && (entry.duration || 999) < (old.duration || 999))) {
                            filteredMap.set(key, entry);
                        }
                    }
                }

                const sched = SCHEDULE[i];
                let sorted = Array.from(filteredMap.values())
                    .filter(s => {
                        let nameValue = (s.fullName || s.name || s.username || "").trim();
                        let nameLower = nameValue.toLowerCase();

                        const draftKeywords = ['test', 'abc', 'nhap', 'nháp', '123', 'demo', 'đemo', 'xxx', '...', '---'];
                        if (draftKeywords.some(k => nameLower === k || nameLower.startsWith(k + ' ') || nameLower.endsWith(' ' + k))) return false;
                        if (/^\d+$/.test(nameLower)) return false;
                        if (nameValue.length < 2) return false;

                        // Lọc theo khung giờ đua Top tuần chính thức
                        if (currentModeFilter === 'official' && sched) {
                            const openMs = new Date(sched.open).getTime();
                            const closeMs = new Date(sched.close).getTime();
                            const submitTime = s.timestamp || parseDateToMs(s.date);
                            if (submitTime > 0) {
                                if (submitTime < openMs || submitTime > closeMs) return false;
                            }
                        }

                        return (s.score || 0) >= 50;
                    })
                    .sort((a, b) => (b.score !== a.score) ? b.score - a.score : (a.duration || 999) - (b.duration || 999));

                let dist = [0, 0, 0, 0, 0];
                sorted.forEach(s => {
                    let sc = s.score || 0;
                    if (sc <= 59) dist[0]++;
                    else if (sc <= 69) dist[1]++;
                    else if (sc <= 79) dist[2]++;
                    else if (sc <= 89) dist[3]++;
                    else dist[4]++;
                });

                const medalsEl = document.getElementById(`medals-${i}`);
                const podiumEl = document.getElementById(`podium-${i}`);

                countBadge.innerText = `${sorted.length} bạn`;
                if (sorted.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:15px; color:#999; font-size:0.8rem;">Chưa có bạn nào đạt từ 50 điểm trở lên.</td></tr>`;
                    chartSection.style.display = 'none';
                    if (medalsEl) medalsEl.style.display = 'none';
                    if (podiumEl) podiumEl.style.display = 'none';
                } else {
                    // 1. Thống kê huy chương
                    let goldCount = 0;
                    let silverCount = 0;
                    let bronzeCount = 0;
                    sorted.forEach(s => {
                        const sc = s.score || 0;
                        if (sc === 100) goldCount++;
                        else if (sc >= 90) silverCount++;
                        else if (sc >= 50) bronzeCount++;
                    });

                    if (medalsEl) {
                        medalsEl.innerHTML = `
                            <div class="medal-item">🥇 <span style="color:#ca8a04; font-weight:700;">Huy chương Vàng (100đ):</span> <span class="medal-badge-count">${goldCount}</span></div>
                            <div class="medal-item">🥈 <span style="color:#64748b; font-weight:700;">Huy chương Bạc (90-95đ):</span> <span class="medal-badge-count">${silverCount}</span></div>
                            <div class="medal-item">🥉 <span style="color:#c2410c; font-weight:700;">Huy chương Đồng (50-85đ):</span> <span class="medal-badge-count">${bronzeCount}</span></div>
                            <div class="medal-item">👥 <span style="font-weight:700;">Tổng thí sinh:</span> <span class="medal-badge-count">${sorted.length} bạn</span></div>
                        `;
                        medalsEl.style.display = 'flex';
                    }

                    // 2. Render 3D Podium Top 3
                    if (podiumEl) {
                        const first = sorted[0];
                        const second = sorted[1] || null;
                        const third = sorted[2] || null;
                        let pHTML = '';

                        // Hạng 2 (Bạc)
                        if (second) {
                            const sName = second.fullName || second.name || second.username;
                            pHTML += `
                                <div class="podium-step podium-rank-2">
                                    <div class="podium-avatar">🥈</div>
                                    <div class="podium-name" title="${sName}">${sName}</div>
                                    <div class="podium-class">${second.className || second.class || ''}</div>
                                    <div class="podium-score">${second.score}đ • ⏱${formatTime(second.duration)}</div>
                                    <div class="podium-pillar">2</div>
                                </div>
                            `;
                        } else {
                            pHTML += `<div class="podium-step podium-rank-2" style="opacity:0.25;"><div class="podium-avatar">🥈</div><div class="podium-pillar">2</div></div>`;
                        }

                        // Hạng 1 (Vàng)
                        const fName = first.fullName || first.name || first.username;
                        pHTML += `
                            <div class="podium-step podium-rank-1">
                                <div class="podium-avatar">
                                    <span class="podium-crown">👑</span>
                                    🥇
                                </div>
                                <div class="podium-name" title="${fName}">${fName}</div>
                                <div class="podium-class">${first.className || first.class || ''}</div>
                                <div class="podium-score">${first.score}đ • ⏱${formatTime(first.duration)}</div>
                                <div class="podium-pillar">1</div>
                            </div>
                        `;

                        // Hạng 3 (Đồng)
                        if (third) {
                            const tName = third.fullName || third.name || third.username;
                            pHTML += `
                                <div class="podium-step podium-rank-3">
                                    <div class="podium-avatar">🥉</div>
                                    <div class="podium-name" title="${tName}">${tName}</div>
                                    <div class="podium-class">${third.className || third.class || ''}</div>
                                    <div class="podium-score">${third.score}đ • ⏱${formatTime(third.duration)}</div>
                                    <div class="podium-pillar">3</div>
                                </div>
                            `;
                        } else {
                            pHTML += `<div class="podium-step podium-rank-3" style="opacity:0.25;"><div class="podium-avatar">🥉</div><div class="podium-pillar">3</div></div>`;
                        }

                        podiumEl.innerHTML = pHTML;
                        podiumEl.style.display = 'flex';
                    }

                    tbody.innerHTML = sorted.map((s, idx) => `
                        <tr>
                            <td><div class="rank">${idx + 1}</div></td>
                            <td><b>${s.fullName || s.name || s.username}</b></td>
                            <td><span class="class-badge">${s.className || s.class || '---'}</span></td>
                            <td><span style="font-size:0.8rem; color:#555;">${s.schoolName || '---'}</span></td>
                            <td><span class="score-badge">${s.score}/100</span></td>
                            <td><span class="time-badge">⏱ ${formatTime(s.duration)}</span></td>
                            <td><span class="attempt-badge">Lần ${s.attempt || 1}</span></td>
                            <td style="font-size:0.75rem; color:#888;">${s.date || ""}</td>
                            <td class="td-admin-action" style="display:${isAdminModeBV ? 'table-cell' : 'none'}; text-align:center;">
                                <button class="btn-del-score" onclick="deleteWeekScore(${i}, '${s._pushId}', '${(s.fullName || s.name || s.username || '').replace(/'/g, "\\'")}', ${s.score}, '${(s.username || '').replace(/'/g, "\\'")}')" style="background:#ef4444; color:#fff; border:none; padding:4px 9px; border-radius:6px; cursor:pointer; font-size:0.75rem; font-weight:bold; font-family:'Lexend',sans-serif;" title="Xóa triệt để tất cả lượt thi của thí sinh này">🗑️ Xóa</button>
                            </td>
                        </tr>
                    `).join('');
                    chartSection.style.display = 'block';
                    updateChart(i, dist);
                }
            }
        }

        let isAdminModeBV = false;

        function toggleAdminModeBV() {
            if (isAdminModeBV) {
                isAdminModeBV = false;
                applyAdminModeBV();
                return;
            }
            const role = localStorage.getItem('userRole');
            const adminUser = localStorage.getItem('adminUsername');
            if (role === 'admin' || adminUser === 'admin') {
                isAdminModeBV = true;
                applyAdminModeBV();
                return;
            }
            const pwd = prompt("Nhập mật khẩu quản trị để bật quyền Xóa/Dọn dẹp điểm:");
            if (pwd === "EduBot@2026") {
                isAdminModeBV = true;
                localStorage.setItem('adminUsername', 'admin');
                localStorage.setItem('userRole', 'admin');
                applyAdminModeBV();
                showToast("Đã bật Chế độ Quản trị! Bạn có thể xóa điểm từng thí sinh hoặc dọn dẹp hàng loạt.", "success", "Chế độ Quản trị");
            } else if (pwd !== null) {
                showToast("Sai mật khẩu quản trị!", "error", "Xác thực thất bại");
            }
        }

        function applyAdminModeBV() {
            const btn = document.getElementById('btn-toggle-admin-bv');
            const txt = document.getElementById('admin-mode-text');
            if (btn && txt) {
                if (isAdminModeBV) {
                    btn.style.background = '#10b981';
                    btn.style.borderColor = '#059669';
                    btn.style.color = '#fff';
                    txt.innerText = 'ĐANG BẬT';
                } else {
                    btn.style.background = '#fff7ed';
                    btn.style.borderColor = '#fdba74';
                    btn.style.color = '#ea580c';
                    txt.innerText = 'TẮT';
                }
            }
            document.querySelectorAll('.th-admin-action, .td-admin-action').forEach(el => {
                el.style.display = isAdminModeBV ? 'table-cell' : 'none';
            });
            document.querySelectorAll('.btn-admin-only').forEach(el => {
                el.style.display = isAdminModeBV ? 'inline-block' : 'none';
            });
        }

        function cleanLocalIfMatch(username, name, allWeeks, weekNum) {
            const curUser = localStorage.getItem('studentUsername') || localStorage.getItem('adminUsername');
            const curName = localStorage.getItem('studentName');
            const isMatch = (curUser && username && curUser.toLowerCase() === username.toLowerCase()) ||
                            (curName && name && curName.trim().toLowerCase() === name.trim().toLowerCase());
            if (isMatch) {
                if (allWeeks) {
                    for (let w = 1; w <= 35; w++) {
                        localStorage.removeItem(`bestScore_Tuan_${w}`);
                    }
                } else if (weekNum) {
                    localStorage.removeItem(`bestScore_Tuan_${weekNum}`);
                }
                localStorage.removeItem('lastCompletedWeek');
                localStorage.removeItem('lastCompletedScore');
            }
        }

        function deleteWeekScore(week, pushId, name, score, username) {
            const scopeChoice = confirm(`Quản trị viên: Bạn muốn xóa thí sinh "${name}"?\n\n• Bấm [OK] để XÓA TRIỆT ĐỂ ở TOÀN BỘ 35 TUẦN trên Bảng Vàng\n• Bấm [HỦY/Cancel] để CHỈ XÓA lượt thi ở Tuần ${week}`);
            
            if (scopeChoice) {
                // XÓA TRIỆT ĐỂ Ở TOÀN BỘ 35 TUẦN
                db.ref('scores').once('value', (snap) => {
                    const allScores = snap.val() || {};
                    const updates = {};
                    let count = 0;
                    for (let wk in allScores) {
                        const weekData = allScores[wk];
                        if (!weekData) continue;
                        for (let k in weekData) {
                            const item = weekData[k];
                            const isMatch = (k === pushId && wk === `Tuan_${week}`) ||
                                           (username && item.username && item.username.toLowerCase() === username.toLowerCase()) ||
                                           (name && item.fullName && item.fullName.trim().toLowerCase() === name.trim().toLowerCase());
                            if (isMatch) {
                                updates[`scores/${wk}/${k}`] = null;
                                count++;
                            }
                        }
                    }
                    db.ref().update(updates).then(() => {
                        cleanLocalIfMatch(username, name, true);
                        showToast(`Đã xóa triệt để ${count} lượt thi của "${name}" ở TOÀN BỘ 35 TUẦN!`, "success", "Xóa thành công");
                    }).catch(err => showToast(`Lỗi khi xóa: ${err.message}`, "error", "Lỗi"));
                });
            } else {
                // CHỈ XÓA Ở TUẦN HIỆN TẠI
                if (!confirm(`Xác nhận CHỈ XÓA các lượt thi của thí sinh "${name}" ở Tuần ${week}?`)) {
                    return;
                }

                db.ref(`scores/Tuan_${week}`).once('value', (snap) => {
                    const weekData = snap.val() || {};
                    const updates = {};
                    let count = 0;

                    for (let k in weekData) {
                        const item = weekData[k];
                        const isMatch = k === pushId ||
                                       (username && item.username && item.username.toLowerCase() === username.toLowerCase()) ||
                                       (name && item.fullName && item.fullName.trim().toLowerCase() === name.trim().toLowerCase());
                        if (isMatch) {
                            updates[k] = null;
                            count++;
                        }
                    }

                    if (count === 0 && pushId) {
                        updates[pushId] = null;
                        count = 1;
                    }

                    db.ref(`scores/Tuan_${week}`).update(updates).then(() => {
                        cleanLocalIfMatch(username, name, false, week);
                        showToast(`Đã xóa triệt để ${count} lượt thi của "${name}" ở Tuần ${week}!`, "success", "Xóa thành công");
                    }).catch((err) => {
                        showToast(`Lỗi khi xóa: ${err.message}`, "error", "Lỗi");
                    });
                });
            }
        }

        // DỌN DẸP TOÀN BỘ ĐIỂM THI CỦA CÁC TÀI KHOẢN ĐÃ BỊ XÓA (MỒ CÔI) TRỰC TIẾP TRÊN BẢNG VÀNG
        function cleanOrphanedScoresBV() {
            Promise.all([
                db.ref('users').once('value'),
                db.ref('scores').once('value')
            ]).then(([usersSnap, scoresSnap]) => {
                const usersData = usersSnap.val() || {};
                const allScores = scoresSnap.val() || {};
                const validUsernames = new Set(Object.keys(usersData).map(u => u.toLowerCase()));
                const updates = {};
                let count = 0;
                let orphanStudents = {};

                for (let weekKey in allScores) {
                    const weekData = allScores[weekKey];
                    if (!weekData) continue;
                    for (let pushId in weekData) {
                        const item = weekData[pushId];
                        const uname = (item.username || '').trim().toLowerCase();
                        const fname = (item.fullName || item.name || '').trim();

                        if (uname.startsWith('guest_')) continue;

                        if (uname && !validUsernames.has(uname)) {
                            updates[`scores/${weekKey}/${pushId}`] = null;
                            count++;
                            const label = `@${uname} (${fname || 'Chưa rõ tên'})`;
                            orphanStudents[label] = (orphanStudents[label] || 0) + 1;
                        }
                    }
                }

                if (count === 0) {
                    showToast("Bảng Vàng hoàn toàn sạch sẽ! Tất cả điểm số đều thuộc về các tài khoản đang tồn tại.", "info", "Bảng Vàng sạch");
                    return;
                }

                const detailList = Object.entries(orphanStudents)
                    .map(([label, c]) => `• ${label}: ${c} lượt thi`)
                    .slice(0, 15)
                    .join('\n');
                const moreText = Object.keys(orphanStudents).length > 15 ? `\n... và ${Object.keys(orphanStudents).length - 15} tài khoản khác` : '';

                if (confirm(`Quản trị viên: Phát hiện ${count} lượt thi trên Bảng Vàng của ${Object.keys(orphanStudents).length} tài khoản ĐÃ BỊ XÓA khỏi hệ thống:\n\n${detailList}${moreText}\n\nXác nhận XÓA TRIỆT ĐỂ toàn bộ ${count} lượt thi này khỏi Bảng Vàng?`)) {
                    db.ref().update(updates).then(() => {
                        showToast(`Đã dọn dẹp sạch sẽ ${count} lượt thi mồ côi trên Bảng Vàng!`, "success", "Dọn dẹp hoàn tất");
                    }).catch((err) => {
                        showToast(`Lỗi khi dọn dẹp: ${err.message}`, "error", "Lỗi");
                    });
                }
            }).catch(err => {
                showToast(`Lỗi khi kiểm tra dữ liệu: ${err.message}`, "error", "Lỗi");
            });
        }

        function cleanTestScoresWeek(week) {
            const weekData = cachedAllScores[`Tuan_${week}`] || cachedAllScores[`tuan${week}`];
            if (!weekData) {
                showToast(`Tuần ${week} chưa có lượt thi nào!`, "info", "Thông báo");
                return;
            }
            const draftKeywords = ['test', 'abc', 'nhap', 'nháp', '123', 'demo', 'đemo', 'xxx', '...', '---', 'admin'];
            const toDelete = [];
            for (let key in weekData) {
                const item = weekData[key];
                const uname = (item.username || '').toLowerCase();
                const fname = (item.fullName || item.name || '').toLowerCase();
                const isTest = draftKeywords.some(k => uname.includes(k) || fname.includes(k)) || uname.startsWith('guest_');
                if (isTest) {
                    toDelete.push({ key, name: item.fullName || item.name || item.username, score: item.score, date: item.date });
                }
            }
            if (toDelete.length === 0) {
                showToast(`Tuần ${week}: Không tìm thấy lượt thi nháp / tài khoản test nào!`, "info", "Thông báo");
                return;
            }
            const preview = toDelete.map((x, i) => `${i + 1}. ${x.name} - ${x.score}đ (${x.date || '---'})`).join('\n');
            if (confirm(`Tìm thấy ${toDelete.length} lượt thi test/nháp ở Tuần ${week}:\n\n${preview}\n\nBạn có chắc chắn muốn XÓA TOÀN BỘ ${toDelete.length} lượt thi này?`)) {
                const updates = {};
                toDelete.forEach(x => {
                    updates[`scores/Tuan_${week}/${x.key}`] = null;
                });
                db.ref().update(updates).then(() => {
                    showToast(`Đã dọn dẹp thành công ${toDelete.length} lượt thi test ở Tuần ${week}!`, "success", "Dọn dẹp thành công");
                }).catch(err => {
                    showToast(`Lỗi: ${err.message}`, "error", "Lỗi");
                });
            }
        }

        function resetWeekScores(week) {
            const weekData = cachedAllScores[`Tuan_${week}`] || cachedAllScores[`tuan${week}`];
            const count = weekData ? Object.keys(weekData).length : 0;
            if (count === 0) {
                showToast(`Tuần ${week} không có dữ liệu để xóa!`, "info", "Thông báo");
                return;
            }
            const check = prompt(`⚠️ CẢNH BÁO: Thao tác này sẽ xóa vĩnh viễn TOÀN BỘ ${count} lượt thi của Tuần ${week}!\nNhập chữ 'XOA' để xác nhận:`);
            if (check === 'XOA') {
                db.ref(`scores/Tuan_${week}`).remove().then(() => {
                    showToast(`Đã xóa toàn bộ điểm số của Tuần ${week}!`, "success", "Xóa thành công");
                }).catch(err => {
                    showToast(`Lỗi: ${err.message}`, "error", "Lỗi");
                });
            } else if (check !== null) {
                showToast("Đã hủy thao tác xóa.", "info", "Đã hủy");
            }
        }

        initAccordion();

        // Tự động kiểm tra quyền Admin khi tải trang
        const savedRole = localStorage.getItem('userRole');
        const savedAdmin = localStorage.getItem('adminUsername');
        if (savedRole === 'admin' || savedAdmin === 'admin') {
            isAdminModeBV = true;
            setTimeout(applyAdminModeBV, 200);
        }
    </script>
    <script src="js/antigravity.js"></script>
    <script>
        if (window.EduAntigravity) {
            EduAntigravity.startAmbient('hero-antigravity', {
                count: window.innerWidth < 600 ? 18 : 28,
                speed: 0.35,
                colors: ['#FFD700', '#FF9800', '#FFFFFF', '#38BDF8', '#F43F5E'],
                opacity: 0.65
            });
        }
    </script>
</body>
